plugins {
    id 'com.android.application'
}

// Version: "<versionBase>.<build>" where <build> is the GitHub Actions run number.
def versionBase = '1.0'
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

// app/phonedash.keystore is created by the first CI run (see build.yml), locked with
// GitHub Actions secret PHONEDASH_KEYSTORE_PASSWORD.
def ksPassword = System.getenv('PHONEDASH_KEYSTORE_PASSWORD')

android {
    namespace 'app.phonedash'
    compileSdk 34

    defaultConfig {
        applicationId 'app.phonedash'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "${versionBase}.${buildNumber}"
    }

    signingConfigs {
        release {
            storeFile file('phonedash.keystore')
            storePassword ksPassword
            keyAlias 'phonedash'
            keyPassword ksPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPassword ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
// No AndroidX on purpose: plain platform APIs only.
